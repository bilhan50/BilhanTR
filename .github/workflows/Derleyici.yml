# Bu eklenti deposu @bilhan50 tarafından geliştirilmektedir.
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

permissions:
  contents: write

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Deposunu Kontrol Et"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"

      - name: "'builds' Deposunu Kontrol Et"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"

      - name: Eski Derlemeleri Temizle
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2
        with:
          # 'tools' paketi modern Android SDK'dan kaldirildi; sdkmanager onu
          # bulamayinca exit code 1 ile patliyordu. Sadece kurulu paketler isteniyor.
          packages: "platform-tools"

      - name: JitPack Hazirligi
        # JitPack master-SNAPSHOT'u ilk istekte build eder ve o sirada 404 dondurur;
        # Gradle bunu "Could not find" hatasi olarak yorumlayip derlemeyi olduruyor.
        # Bu adim iki bağımlılığı da gercek dosyalari inene kadar isitir.
        run: |
          bases=(
            "https://jitpack.io/com/github/recloudstream/gradle/master-SNAPSHOT"
            "https://jitpack.io/com/github/recloudstream/gradle/gradle/master-SNAPSHOT"
          )
          for base in "${bases[@]}"; do
            ok=0
            for i in $(seq 1 24); do
              ver=$(curl -fsSL --max-time 30 "$base/maven-metadata.xml" 2>/dev/null \
                    | grep -o '<version>[^<]*</version>' | head -n 1 | sed -e 's/<[^>]*>//g')
              if [ -n "$ver" ]; then
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/gradle-$ver.pom")
                echo "  [$i] $base/gradle-$ver.pom -> HTTP $code"
                if [ "$code" = "200" ]; then ok=1; break; fi
              else
                echo "  [$i] metadata alinamadi: $base"
              fi
              sleep 15
            done
            if [ "$ok" != "1" ]; then echo "::warning::JitPack isitilamadi: $base"; fi
          done

      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          if ! ./gradlew make makePluginsJson; then
            echo "::warning::ilk deneme basarisiz (muhtemelen JitPack), 60sn sonra tekrar deneniyor"
            sleep 60
            ./gradlew make makePluginsJson
          fi
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Derlemeleri Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "bilhan50@users.noreply.github.com"
          git config --local user.name "bilhan50"
          git add -A
          git diff --cached --quiet || git commit -m "${GITHUB_SHA::7} - otomatik derleme"
          git push origin HEAD:builds
