# Bu eklenti deposu @bilhan50 tarafından geliştirilmektedir.
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

permissions:
  contents: write

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Deposunu Kontrol Et"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"

      - name: "'builds' Deposunu Kontrol Et"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"

      - name: Eski Derlemeleri Temizle
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2
        with:
          # 'tools' paketi modern Android SDK'dan kaldirildi; sdkmanager onu
          # bulamayinca exit code 1 ile patliyordu. Sadece kurulu paketler isteniyor.
          packages: "platform-tools"

      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Derlemeleri Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "bilhan50@users.noreply.github.com"
          git config --local user.name "bilhan50"
          git add -A
          git diff --cached --quiet || git commit -m "${GITHUB_SHA::7} - otomatik derleme"
          git push origin HEAD:builds
